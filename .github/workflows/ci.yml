name: Wanderlust CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  IMAGE_NAME: gauravaa/wanderlust

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Test & Lint
  # ─────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Verify backend entry point exists
        run: |
          test -f backend/app.js && echo "app.js found ✅" || (echo "app.js NOT found ❌" && exit 1)

      - name: Run backend tests
        working-directory: ./backend
        run: npm test --if-present
        continue-on-error: false

      - name: Verify frontend views exist
        run: |
          echo "=== EJS Views ==="
          find frontend/views -name "*.ejs" | sort
          echo "=== CSS Files ==="
          find frontend/public/css -name "*.css"
          echo "=== JS Files ==="
          find frontend/public/js -name "*.js"
          echo "Frontend assets verified ✅"

  # ─────────────────────────────────────────
  # JOB 2 — Docker Build & Push
  # Runs only if Job 1 passes
  # ─────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test                         # waits for test job to pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Git SHA (short)
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Summary
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 3 — Deploy
  # Runs only on push to main branch
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker                        # waits for docker job to pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -fsSL "$RENDER_DEPLOY_HOOK_URL" \
            && echo "Render deploy triggered ✅" \
            || (echo "Render deploy failed ❌" && exit 1)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Deploy Summary
        run: |
          echo "### 🚀 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://wanderlust-airq.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 4 — Deploy to Kubernetes
  # Runs only on push to main, after Docker image is pushed
  # Requires KUBECONFIG secret to be set
  # ─────────────────────────────────────────
  kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KUBECONFIG != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Extract Git SHA (short)
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Kubernetes deployment image
        run: |
          kubectl set image deployment/wanderlust-deployment \
            wanderlust=gauravaa/wanderlust:${{ steps.vars.outputs.sha }} \
            -n wanderlust

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/wanderlust-deployment \
            -n wanderlust \
            --timeout=120s

      - name: Verify pods are running
        run: kubectl get pods -n wanderlust

      - name: Kubernetes Deploy Summary
        run: |
          echo "### ☸️ Deployed to Kubernetes" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`wanderlust\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`gauravaa/wanderlust:${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: \`wanderlust-deployment\`" >> $GITHUB_STEP_SUMMARY

